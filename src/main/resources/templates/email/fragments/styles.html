<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<th:block th:fragment="styles">

  <style>

    body{
      margin:0;
      padding:40px 20px;
      background:#f5f6fa;
      font-family:Arial,Helvetica,sans-serif;
      color:#333333;
    }

    .wrapper{
      width:100%;
    }

    .container{
      width:600px;
      background:#ffffff;
      border-radius:8px;
      overflow:hidden;
      border:1px solid #e5e5e5;
    }

    .content{
      padding:40px;
    }

    .info-box{
      background:#f4f8ff;
      border:1px solid #d7e5ff;
      border-radius:6px;
      padding:18px;
      margin:30px 0;
    }

    .info-table{
      width:100%;
      border-collapse:collapse;
    }

    .info-table td{
      padding:10px 0;
    }

    .info-table td:first-child{
      width:180px;
      font-weight:bold;
      color:#555;
    }

    .code-box{
      background:#f4f8ff;
      border:1px solid #d7e5ff;
      border-radius:6px;
      padding:18px;
      margin:30px 0;
      text-align:center;
    }

    .verification-code{
      font-size:34px;
      letter-spacing:8px;
      color:#0d6efd;
      font-weight:bold;
    }

    .button{
      display:inline-block;
      background:#0d6efd;
      color:white!important;
      text-decoration:none;
      padding:14px 30px;
      border-radius:6px;
      font-weight:bold;
    }

    .success{
      color:#198754;
    }

    .warning{
      color:#dc3545;
    }

    .small{
      font-size:13px;
      color:#777;
    }

    .center{
      text-align:center;
    }

    .divider{
      border-top:1px solid #eeeeee;
      margin:30px 0;
    }

    .mt-0{
      margin-top:0;
    }

    .mb-0{
      margin-bottom:0;
    }

  </style>

</th:block>

</body>

</html>
