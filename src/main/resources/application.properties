spring.application.name=e-store

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================
# Database
# ==========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==========================
# JWT
# ==========================
auth.token.access-secret=${ACCESS_SECRET:test-access-secret}
auth.token.access-expiration-ms=${ACCESS_EXPIRATION:3600000}

auth.token.refresh-secret=${REFRESH_SECRET:test-refresh-secret}
auth.token.refresh-expiration-ms=${REFRESH_EXPIRATION:86400000}

# ==========================
# Upload
# ==========================
app.upload.dir=${UPLOAD_DIR:uploads}

# ==========================
# Server
# ==========================
server.port=${SERVER_PORT:8070}
api.prefix=${API_PREFIX:/api/v1}

# ==========================
# Payment
# ==========================
app.payment.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:8070/api/v1/payments/callback}
app.payment.timeout.minutes=${PAYMENT_TIMEOUT_MINUTES:30}

# ==========================
# JPA / Flyway
# ==========================
spring.flyway.enabled=true

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Production defaults
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==========================
# Multipart
# ==========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================
# Logging
# ==========================
logging.level.org.flywaydb=${FLYWAY_LOG_LEVEL:INFO}
logging.level.org.springframework.boot.autoconfigure.flyway=${FLYWAY_LOG_LEVEL:INFO}
logging.level.com.benkih.estore=INFO

# ==========================
# Email
# ==========================
app.email.provider=mailtrap

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:test}
spring.mail.password=${SPRING_MAIL_PASSWORD:test}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# Paystack
# ==========================
paystack.base-url=${PAYSTACK_BASE_URL:http://localhost}
paystack.secret-key=${PAYSTACK_SECRET_KEY:test}

# ==========================
# Frontend
# ==========================
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

