spring.application.name=e-store

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================
# Database
# ==========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==========================
# JWT
# ==========================
auth.token.access-secret=${ACCESS_SECRET:test-access-secret}
auth.token.access-expiration-ms=${ACCESS_EXPIRATION:3600000}

auth.token.refresh-secret=${REFRESH_SECRET:test-refresh-secret}
auth.token.refresh-expiration-ms=${REFRESH_EXPIRATION:86400000}

# ==========================
# Upload
# ==========================
app.upload.dir=${UPLOAD_DIR:uploads}

# ==========================
# Server
# ==========================
server.port=${SERVER_PORT:8080}
api.prefix=${API_PREFIX:/api/v1}

# CORS — frontend.base-url is always allowed; add further origins as a CSV
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ==========================
# OpenAPI / Swagger UI
# ==========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
openapi.server-description=${OPENAPI_SERVER_DESCRIPTION:Local development}
info.app.version=${APP_VERSION:1.0.0}

# ==========================
# Payment
# ==========================
app.payment.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:3000/payments/callback}
app.payment.timeout.minutes=${PAYMENT_TIMEOUT_MINUTES:30}

# ==========================
# JPA / Flyway
# ==========================
spring.flyway.enabled=true

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Production defaults
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==========================
# Multipart
# ==========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================
# Actuator / health
# ==========================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# ==========================
# Logging
# ==========================
logging.level.org.flywaydb=${FLYWAY_LOG_LEVEL:INFO}
logging.level.org.springframework.boot.autoconfigure.flyway=${FLYWAY_LOG_LEVEL:INFO}
logging.level.com.benkih.estore=INFO

# ==========================
# Email
# ==========================
app.email.provider=${EMAIL_PROVIDER:mailtrap}
app.email.from=${MAIL_FROM:hello@estore.com}
app.email.from-name=${MAIL_FROM_NAME:Estore}

# Mailgun HTTP API — used when app.email.provider=mailgun
app.mailgun.api-key=${MAILGUN_API_KEY:}
app.mailgun.domain=${MAILGUN_DOMAIN:}
app.mailgun.region=${MAILGUN_REGION:us}
app.mailgun.connect-timeout-ms=${MAILGUN_CONNECT_TIMEOUT_MS:10000}
app.mailgun.response-timeout-ms=${MAILGUN_RESPONSE_TIMEOUT_MS:10000}

# Delivery tracking: outbox row in the business transaction, send after commit, recover on a timer
app.notification.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:3}
app.notification.retry-delay-ms=${NOTIFICATION_RETRY_DELAY_MS:500}
app.notification.claim-lease-ms=${NOTIFICATION_CLAIM_LEASE_MS:60000}
app.notification.scan-delay-ms=${NOTIFICATION_SCAN_DELAY_MS:30000}
app.notification.retry-batch-size=${NOTIFICATION_RETRY_BATCH_SIZE:50}
app.notification.dispatch-threads=${NOTIFICATION_DISPATCH_THREADS:4}
app.notification.queue-capacity=${NOTIFICATION_QUEUE_CAPACITY:200}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:test}
spring.mail.password=${SPRING_MAIL_PASSWORD:test}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# Paystack
# ==========================
paystack.base-url=${PAYSTACK_BASE_URL:http://localhost}
paystack.secret-key=${PAYSTACK_SECRET_KEY:test}

# ==========================
# Frontend
# ==========================
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# ==========================
# Settlement
# ==========================
settlement.schedule=${SETTLEMENT_SCHEDULE:0 */10 * * * *}

payout.provider=${PAYOUT_PROVIDER:PAYSTACK}

