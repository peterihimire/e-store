# Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway
spring.flyway.enabled=false

# Hibernate
spring.jpa.hibernate.ddl-auto=none

# Mail
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test

# JWT
auth.token.access-secret=test-secret
auth.token.access-expiration-ms=3600000
auth.token.refresh-secret=test-refresh
auth.token.refresh-expiration-ms=3600000

# Upload
app.upload.dir=/tmp/uploads

# Paystack
paystack.base-url=http://localhost
paystack.secret-key=test

frontend.base-url=http://localhost:3000
api.prefix=/api/v1
server.port=0