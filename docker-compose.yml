# Local development: build the image from source.
# For the published DockerHub image use: docker compose -f docker-compose.registry.yml up -d
services:
  estore:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-estore}:${IMAGE_TAG:-latest}
    container_name: estore
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
